<!DOCTYPE html><html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0C0E0C">
<title>Bereke × N1 — Инвестиционные цели</title>
<style>
:root{
 --bg:#0C0E0C; --card:#1C1F1C; --card2:#242724; --chip:#232623;
 --green:#21A038; --greenbr:#32D74B; --greend:#0E7A2B;
 --txt:#FFFFFF; --mut:#9BA19C; --mut2:#6E736F; --line:#2A2E2A;
 --peri:#8E96F8; --red:#FF5A5F; --redbg:#3A1F22; --amber:#F5C043; --amberbg:#3A311C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#101312;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.35}
button{font-family:inherit}
/* ---------- phone frame ---------- */
.phone{position:relative;background:var(--bg);overflow:hidden}
@media(min-width:521px){
 body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#191c1a radial-gradient(1200px 800px at 50% -10%,#232a25,#141715)}
 .phone{width:393px;height:852px;border-radius:54px;border:11px solid #000;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px #2c2f2c}
}
@media(max-width:520px){
 .phone{position:fixed;inset:0;width:100vw;height:100dvh}
}
/* ---------- screens ---------- */
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;background:var(--bg);-webkit-overflow-scrolling:touch}
.scr.act{display:block;animation:slidein .22s ease}
@keyframes slidein{from{opacity:.4;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.top{position:sticky;top:0;z-index:6;background:var(--bg);padding:0 16px}
.sbar{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 10px 0 14px}
.stime{font-size:16px;font-weight:700;letter-spacing:.2px}
.sicons{display:flex;gap:6px;align-items:center}
.nav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:48px}
.nbtn{background:none;border:none;color:#fff;cursor:pointer;padding:8px;display:flex;align-items:center;justify-content:center;font-size:19px}
.nbtn:active{opacity:.6}
.ttl{text-align:center}
.ttl .t{font-size:16px;font-weight:700}
.ttl .s{font-size:12px;color:var(--mut);margin-top:1px}
.prog{display:flex;gap:6px;padding:4px 0 12px}
.prog .sg{flex:1;height:4px;border-radius:2px;background:#242824}
.prog .sg.on{background:var(--green)}
.cnt{padding:6px 16px 8px}
/* ---------- typography ---------- */
.h1{font-size:27px;font-weight:800;letter-spacing:-.4px;margin:8px 0 6px}
.lead{font-size:16px;color:var(--mut);margin:0 0 18px}
.h2{font-size:20px;font-weight:800;margin:22px 0 4px}
.h2sub{font-size:14px;color:var(--mut);margin:0 0 12px}
/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 4px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--chip);border:none;border-radius:22px;padding:11px 16px;font-size:15px;font-weight:600;color:#fff;cursor:pointer}
.chip.on{background:var(--green)}
.chip:active{opacity:.75}
/* ---------- fields ---------- */
.fld{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:16px;padding:13px 16px;margin:14px 0;min-height:64px;cursor:text}
.fld .ic{font-size:22px;width:26px;text-align:center;flex:0 0 26px;color:var(--mut)}
.fld .bd{flex:1;min-width:0}
.fld .lb{font-size:13px;color:var(--mut)}
.fld input{background:none;border:none;color:#fff;font-size:17px;font-weight:600;width:100%;outline:none;padding:2px 0 0}
.fld input::placeholder{color:#7d827e;font-weight:400}
.fld .val{font-size:16px;font-weight:700;padding-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld .x{color:#8E938F;cursor:pointer;padding:6px;border:none;background:none;font-size:15px;flex:0 0 auto}
.fnote{font-size:12.5px;color:var(--mut2);margin:-6px 2px 12px}
/* ---------- segmented ---------- */
.seg2{display:flex;background:var(--card);border-radius:14px;padding:3px;margin:14px 0}
.seg2 button{flex:1;padding:12px 6px;border:none;border-radius:11px;background:none;color:var(--mut);font-size:15px;font-weight:600;cursor:pointer}
.seg2 button.on{background:#2B2F2B;color:var(--greenbr)}
/* ---------- CTA ---------- */
.ctaw{position:sticky;bottom:0;z-index:5;padding:26px 16px 8px;background:linear-gradient(180deg,rgba(12,14,12,0) 0%,var(--bg) 42%)}
.cta{display:block;width:100%;padding:17px;border:none;border-radius:16px;background:var(--green);color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:10px}
.cta:disabled{opacity:.35;cursor:default}
.cta:not(:disabled):active{background:var(--greend)}
.cta.sec{background:rgba(125,130,126,.28);backdrop-filter:blur(6px)}
.cta.white{background:#fff;color:#0C0E0C}
.cta.ghost{background:none;color:#fff;font-weight:600;padding:10px}
.cta.danger{background:none;color:var(--red);font-weight:600;padding:10px}
.homebar{width:135px;height:5px;border-radius:3px;background:#fff;margin:6px auto 6px;opacity:.92}
/* ---------- landing ---------- */
.hero{background:var(--card);border-radius:20px;padding:34px 22px 28px;text-align:center;margin:4px 0 16px}
.hero .em{font-size:86px;line-height:1;filter:drop-shadow(0 14px 26px rgba(50,140,220,.35))}
.hero .t{font-size:25px;font-weight:800;margin:18px 0 8px}
.hero .s{font-size:15.5px;color:var(--mut)}
.tpls{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.tpls::-webkit-scrollbar{display:none}
.tpl{flex:0 0 156px;background:var(--card);border-radius:18px;padding:16px 14px 14px;cursor:pointer}
.tpl:active{background:var(--card2)}
.tpl .t{font-size:18px;font-weight:800}
.tpl .s{font-size:13px;color:var(--mut);margin:2px 0 8px}
.tpl .em{font-size:44px;text-align:center;margin:4px 0 10px}
.tpl .p{font-size:13px;color:var(--mut)}
.help{display:flex;align-items:center;gap:12px;border:1.5px dashed #5560c8;border-radius:16px;padding:13px 15px;margin:16px 0 4px;cursor:pointer}
.help .ava{width:44px;height:44px;border-radius:50%;background:#3a3330;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 44px}
.help .t{font-size:15px;font-weight:700}
.help .s{font-size:13px;color:var(--mut);margin-top:1px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 4px}
.bcell{background:var(--card);border-radius:16px;padding:14px}
.bcell .t{font-size:15px;font-weight:700;margin-bottom:4px}
.bcell .s{font-size:12.5px;color:var(--mut)}
/* ---------- goal cards on home ---------- */
.gcard{background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:12px;cursor:pointer}
.gcard:active{background:var(--card2)}
.gc-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.gc-e{font-size:26px;width:32px;text-align:center}
.gc-n{font-size:16px;font-weight:800}
.gc-s{font-size:13px;color:var(--mut);margin-top:1px}
.gc-prog{font-size:12.5px;color:var(--mut);margin-top:7px}
.gc-prog b{color:#fff}
.addg{display:block;width:100%;padding:15px;border:1.5px dashed #3A3F3A;border-radius:16px;background:none;color:var(--mut);font-size:15px;font-weight:700;cursor:pointer;margin:2px 0 8px}
/* ---------- survey ---------- */
.q{display:flex;gap:14px;margin:24px 0 12px;align-items:flex-start}
.qn{font-size:30px;line-height:1.05;color:var(--peri);font-weight:300;flex:0 0 26px;text-align:center}
.qt{font-size:16px;font-weight:600;line-height:1.35;padding-top:3px}
/* ---------- profile result ---------- */
.pwrap{text-align:center;padding:26px 10px 10px;position:relative}
.pstar{position:absolute;font-size:64px;color:#3a423c;opacity:.55;user-select:none}
.pemoji{font-size:120px;line-height:1.15;filter:drop-shadow(0 0 55px rgba(50,215,75,.4))}
.pname{font-size:28px;font-weight:800;letter-spacing:-.4px;margin:22px 0 12px}
.pdesc{font-size:16px;color:var(--mut);max-width:320px;margin:0 auto}
/* ---------- offer ---------- */
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.ch{font-size:15px;font-weight:800;margin-bottom:10px}
.rowcard{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:12px;cursor:pointer}
.rowcard:active{background:var(--card2)}
.rowcard .ic{font-size:24px;width:30px;text-align:center;flex:0 0 30px}
.rowcard .bd{flex:1;min-width:0}
.rowcard .lb{font-size:13px;color:var(--mut)}
.rowcard .vv{font-size:15.5px;font-weight:800;margin-top:2px}
.rowcard .ss{font-size:13px;color:var(--mut);margin-top:2px}
.pbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:2px 0 14px}
.pbar i{display:block;height:100%}
.lgr{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:15px}
.lgr .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.lgr .n{flex:1;font-weight:600}
.lgr .w{color:var(--mut);font-size:14px}
.prod{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:13px 14px;margin-bottom:10px}
.pic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 42px}
.prod .bd{flex:1;min-width:0}
.prod .w{font-size:12.5px;color:var(--mut)}
.prod .n{font-size:15.5px;font-weight:800;margin-top:1px}
.prod .rt{text-align:right}
.prod .y{font-size:14px;font-weight:800;color:var(--greenbr)}
.prod .a{font-size:14px;font-weight:600;margin-top:2px}
.prod .inf{border:none;background:none;color:#787D79;font-size:17px;cursor:pointer;padding:4px;flex:0 0 auto}
.term{background:linear-gradient(135deg,#1E4A2A,#143520);border:1px solid #2A5E38}
.term .l{font-size:12px;color:#9fd4ab;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.term .v{font-size:24px;font-weight:800;margin-top:5px}
.term .s{font-size:13px;color:#9fd4ab;margin-top:3px}
.tiles{display:flex;gap:10px;margin-bottom:12px}
.tile{flex:1;border-radius:16px;padding:13px 14px}
.tile.dark{background:linear-gradient(135deg,var(--green),var(--greend));color:#fff}
.tile.soft{background:#18301E;color:var(--greenbr)}
.tile .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.9;font-weight:700}
.tile .v{font-size:19px;font-weight:800;margin-top:4px;white-space:nowrap}
.bar2{height:10px;background:#2A2E2A;border-radius:5px;overflow:hidden;margin:4px 0 8px}
.bar2 i{display:block;height:100%;background:var(--green);border-radius:5px}
.cfrow{display:flex;align-items:center;gap:9px;font-size:13px;padding:4px 0}
.cfrow .dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.cfrow .n{flex:0 0 110px;font-weight:600}
.cfrow .w{flex:0 0 38px;color:var(--mut);text-align:right}
.cfrow .d{flex:1;color:var(--mut2);font-size:12px}
.cfrow .m{font-weight:700;color:var(--greenbr)}
.yrh{display:flex;font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding:0 6px 6px}
.yrr{display:flex;font-size:13.5px;padding:7px 6px;border-top:1px solid #262A26}
.yrr.hit{background:#1B3322;border-radius:8px;font-weight:800;color:var(--greenbr);border-top-color:transparent}
.yc1{flex:0 0 46px}.yc{flex:1;text-align:right}
.srow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.srow label{flex:1;font-size:14px;color:var(--mut)}
.srow input{width:120px;background:#262A26;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;padding:10px 12px;text-align:right;outline:none}
.srow input:focus{outline:2px solid var(--green)}
.srow .u{font-size:13px;color:var(--mut);flex:0 0 62px}
.snote{font-size:12.5px;color:var(--mut2);margin-top:4px;line-height:1.45}
.banner{border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.45;margin-bottom:12px}
.banner.red{background:var(--redbg);color:#ff9296}
.banner.amber{background:var(--amberbg);color:#e8c069}
.fine{font-size:11px;color:var(--mut2);line-height:1.55;margin:16px 0 6px}
/* ---------- portfolio settings ---------- */
.pcard{background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:12px}
.pc-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.pc-n{font-size:16px;font-weight:800}
.pc-w{font-size:13px;color:var(--mut);margin-top:2px}
.pc-y{font-size:14px;font-weight:800;color:var(--greenbr)}
.pc-a{font-size:14px;font-weight:600;margin-top:3px}
.px{border:none;background:none;color:#787D79;font-size:15px;cursor:pointer;padding:4px 2px 4px 8px;flex:0 0 auto}
.px:active{color:var(--red)}
.pc-mm{display:flex;justify-content:space-between;font-size:12px;color:var(--mut2);margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:2px 0 0;--f:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--green) var(--f),#2E322E var(--f))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#0C0E0C;border:6px solid var(--green);margin-top:-8px}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#2E322E}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--green)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#0C0E0C;border:6px solid var(--green)}
.sumlbl{font-size:14px;color:var(--mut);margin:4px 2px 12px}
.sumlbl b{color:#fff}.sumlbl b.warn{color:var(--red)}
/* ---------- sheets ---------- */
.ovl{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end;animation:fadein .18s}
.sheet{background:#1E211E;border-radius:24px 24px 0 0;width:100%;max-height:78%;overflow-y:auto;padding:10px 16px 30px;animation:sheetup .22s ease}
@keyframes sheetup{from{transform:translateY(60px)}to{transform:none}}
.grab{width:40px;height:5px;border-radius:3px;background:#3A3F3A;margin:4px auto 14px}
.sh-t{font-size:19px;font-weight:800;margin-bottom:12px}
.shrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #262A26;cursor:pointer}
.shrow:last-child{border-bottom:none}
.shrow:active{background:#242724}
.shrow .bd{flex:1}
.shrow .n{font-size:15.5px;font-weight:700}
.shrow .s{font-size:12.5px;color:var(--mut);margin-top:1px}
.shrow .y{font-size:14px;font-weight:800;color:var(--greenbr)}
.irow{display:flex;justify-content:space-between;font-size:14.5px;padding:9px 2px;border-bottom:1px solid #262A26}
.irow:last-child{border-bottom:none}
.irow .k{color:var(--mut)}
.irow .v{font-weight:700}
/* ---------- success ---------- */
.succ{position:absolute;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;animation:fadein .25s}
.succ.act{display:flex}
.succ .em{font-size:96px;filter:drop-shadow(0 0 55px rgba(50,215,75,.4))}
.succ .t{font-size:26px;font-weight:800;margin:20px 0 10px}
.succ .s{font-size:15.5px;color:var(--mut);max-width:300px}
.succ .cta{margin-top:34px}
/* ---------- print view (light, из исходного движка) ---------- */
#printView{display:none}
@page{size:A4 portrait;margin:12mm}
@media print{
 html,body{background:#fff!important;display:block!important;color:#1c2b22}
 .phone{display:none!important}
 #printView{display:block!important}
 .pv-goalhead{background:linear-gradient(135deg,#00A651,#007A3D);color:#fff;border-radius:10px 10px 0 0;padding:11px 15px;margin:-13px -15px 12px}
 .pv-goalname{font-size:17px;font-weight:800}
 .pv-goalsum{font-size:27px;font-weight:800;margin-top:3px;line-height:1.1}
 .pv-goalmeta{font-size:11.5px;opacity:.95;margin-top:2px}
 .pv-hero{display:flex;gap:9px;margin-bottom:11px;flex-wrap:wrap}
 .pv-hbox{flex:1;min-width:120px;border-radius:9px;padding:9px 11px;border:1.5px solid #d7e3da}
 .pv-hbox .l{font-size:8.5px;color:#6b7a70;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
 .pv-hbox .v{font-size:16px;font-weight:800;color:#1c2b22;margin-top:2px;line-height:1.15}
 .pv-hbox.term2{background:#E8F5EC;border-color:#00A651}.pv-hbox.term2 .v{color:#007A3D;font-size:18px}
 .pv-hbox.money{background:#f3f7f4}
 .pv-hbox.coup{background:#FDF0D8;border-color:#e8c98a}.pv-hbox.coup .v{color:#8a5a00}
 .pv-prod{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:4px 0;border-bottom:1px solid #eef3ef}
 .pv-prod:last-child{border-bottom:none}
 .pv-prod .nm{flex:1;font-weight:600;color:#1c2b22}
 .pv-prod .w{color:#6b7a70;font-size:11px}
 .pv-prod .amt{font-weight:700;color:#007A3D}
 .pv-yr{margin-top:12px;border-top:1px solid #d7e3da;padding-top:9px}
 .pv-yrh{display:flex;font-size:9px;color:#6b7a70;text-transform:uppercase;letter-spacing:.4px;font-weight:600;padding-bottom:4px}
 .pv-yrr{display:flex;font-size:11.5px;padding:4px 0;border-top:1px solid #eef3ef}
 .pv-yrr.hit{background:#E8F5EC;border-radius:6px;font-weight:800;color:#007A3D}
 .pv-yc1{flex:0 0 46px;padding-left:5px}.pv-yc{flex:1;text-align:right;padding-right:5px}
 .pv-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid #00A651;padding-bottom:6px;margin-bottom:10px}
 .pv-brand{font-size:15pt;font-weight:800;color:#007A3D}.pv-brand span{color:#111}
 .pv-sub{font-size:8pt;color:#6b7a70;text-align:right}
 .pv-h1{font-size:14pt;color:#007A3D;margin:0 0 8px;font-weight:800}
 .pv-card{border:0.6px solid #d7e3da;border-radius:8px;padding:9px 11px;margin-bottom:8px;page-break-inside:avoid}
 .pv-kpi{display:flex;gap:8px;margin:6px 0}
 .pv-k{flex:1;background:#f3f7f4;border-radius:6px;padding:6px 9px;text-align:center}
 .pv-k .l{font-size:6.5pt;color:#6b7a70;text-transform:uppercase}.pv-k .v{font-size:11pt;font-weight:800;color:#007A3D}
 .pv-sect{font-size:8pt;color:#6b7a70;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin:9px 0 4px}
 .pv-foot{border-top:0.6px solid #d7e3da;padding-top:6px;margin-top:10px;font-size:7pt;color:#7a877e;line-height:1.45}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>

<div class="phone" id="phone">
 <div class="scr" id="scr-home"></div>
 <div class="scr" id="scr-s1"></div>
 <div class="scr" id="scr-s2"></div>
 <div class="scr" id="scr-s3"></div>
 <div class="scr" id="scr-s4"></div>
 <div class="scr" id="scr-s5"></div>
 <div class="scr" id="scr-pset"></div>
 <div id="sheetWrap"></div>
 <div class="succ" id="succ"></div>
</div>
<div id="printView"></div>

<script>
/* ================== ДВИЖОК (перенесён из исходника без изменений математики) ================== */
var Y={'Депозит ₸':16,'4% фонд':4,'Евробонды':5.75,'Дракон ₸':20,'Дракон $':10,'Самрук ₸':22,'Самрук $':8.5,'Жолбарыс':8,'Барыс ₸':30,'Барыс $':15,'Арыстан ₸':30,'Арыстан $':15};
var CF={'Депозит ₸':16,'4% фонд':4,'Евробонды':5.75,'Дракон ₸':0,'Дракон $':0,'Самрук ₸':22,'Самрук $':8.5,'Жолбарыс':8,'Барыс ₸':30,'Барыс $':15,'Арыстан ₸':30,'Арыстан $':15};

function fmtNum(x){return String(Math.round(x)||0).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function fmtI(x){return x>0?fmtNum(x):'';}
function pnum(s){return parseInt(String(s).replace(/[^\d]/g,''))||0;}
function pl(n,a,b,c){n=Math.abs(n)%100;var d=n%10;if(n>10&&n<20)return c;if(d>1&&d<5)return b;if(d===1)return a;return c;}
function ftime(m){if(m===0)return 'уже достигнуто';if(m===null||!isFinite(m))return 'не достигается';var mm=Math.ceil(m),y=Math.floor(mm/12),o=mm%12,s=[];if(y)s.push(y+' '+pl(y,'год','года','лет'));if(o)s.push(o+' '+pl(o,'месяц','месяца','месяцев'));return s.join(' ')||'меньше месяца';}
function ok(){return st.a!==undefined&&st.inc!==undefined&&st.p!==undefined&&st.sh!==undefined&&st.h!==undefined;}
function mkPort(cur,prof){var l=PORT[cur][prof],w={},o=[];l.forEach(function(x){w[x[0]]=x[1];o.push(x[0]);});return {w:w,o:o};}
function sym(g){return g.cur==='Тенге'?'₸':'$';}
function fmtG(x,g){return fmtNum(x)+' '+sym(g);}
function eff(g,p){return (p==='4% фонд'&&g.cur==='Доллар'&&g.P0*g.weights[p]/100>100000)?'Евробонды':p;}
function gYield(g){var sw=0,sy=0;g.order.forEach(function(p){var e=eff(g,p);sw+=g.weights[p];sy+=g.weights[p]*Y[e];});return sw>0?sy/sw:0;}
function gSum(g){return g.order.reduce(function(a,p){return a+g.weights[p];},0);}
function gRisk(g){var sw=0,sr=0;g.order.forEach(function(p){var e=eff(g,p);sw+=g.weights[p];sr+=g.weights[p]*RISK[e];});var sc=sw>0?sr/sw:0;return sc<0.6?0:(sc<=1.3?1:2);}
function gTarget(g){if(g.type==='accum')return g.sum;var y=gYield(g);return y>0?g.sum*12/(y/100):0;}
function initS(g){var b={},tw={},sw=0,base={};g.order.forEach(function(p){var e=eff(g,p);b[e]=(b[e]||0)+g.P0*g.weights[p]/100;tw[e]=(tw[e]||0)+g.weights[p];sw+=g.weights[p];});
 Object.keys(b).forEach(function(p){if(SIMPLE[p])base[p]=b[p];});
 return {b:b,tw:tw,sw:sw,cash:0,coup:0,base:base};}
function step(g,S,m){var add=(g.freq==='год')?((m>12&&m%12===1)?g.PMT:0):g.PMT,cn=CASHP[g.cur];
 S.coup=0;
 Object.keys(S.b).forEach(function(p){
  if(TERM[p]===0){S.b[p]*=(1+(Y[p]/100)/12);return;}
  if(SIMPLE[p]){S.b[p]=S.base[p]*(1+(Y[p]/100)/12*m);return;}
  if(TERM[p]>0&&m%TERM[p]===0&&CF[p]===0){S.b[p]*=Math.pow(1+Y[p]/100,TERM[p]/12);return;}
  if(CF[p]>0&&m%6===0){var c=S.b[p]*(CF[p]/100)/2;S.coup+=c;
   if(st.coupon==='reinv'&&c>=MINNOTE[g.cur])S.b[p]+=c;else if(st.coupon!=='out')S.cash+=c;}});
 S.cash*=(1+(Y[cn]/100)/12);
 if(S.sw>0&&add>0)Object.keys(S.b).forEach(function(p){var a=add*(S.tw[p]/S.sw);S.b[p]+=a;if(SIMPLE[p])S.base[p]+=a;});
 return S;}
function tot(S){return S.cash+Object.keys(S.b).reduce(function(a,k){return a+S.b[k];},0);}
function fvG(g,N){var S=initS(g);for(var m=1;m<=N;m++)step(g,S,m);return tot(S);}
function m2g(g,C){if(!(C>0))return null;var S=initS(g);if(tot(S)>=C)return 0;
 for(var m=1;m<=720;m++){step(g,S,m);if(tot(S)>=C)return m;}return Infinity;}
function cfList(g){var r=[];g.order.forEach(function(p){var e=eff(g,p);r.push({p:e,w:g.weights[p],cf:CF[e],money:g.P0*g.weights[p]/100*CF[e]/100});});return r;}
function solvePMT(g,C,N){var sv=g.PMT;C=C*1.0005;g.PMT=0;
 if(fvG(g,N)>=C){g.PMT=sv;return 0;}
 var lo=0,hi=Math.max(C/Math.max(N,1),1000),okk=false;
 for(var i=0;i<60;i++){g.PMT=hi;if(fvG(g,N)>=C){okk=true;break;}hi*=2;}
 if(!okk){g.PMT=sv;return Infinity;}
 for(var j=0;j<70;j++){var m=(lo+hi)/2;g.PMT=m;if(fvG(g,N)>=C)hi=m;else lo=m;}
 g.PMT=sv;return hi;}
function solveP0(g,C,N){var sv=g.P0;C=C*1.0005;g.P0=0;
 if(fvG(g,N)>=C){g.P0=sv;return 0;}
 var lo=0,hi=Math.max(C,1000),okk=false;
 for(var i=0;i<60;i++){g.P0=hi;if(fvG(g,N)>=C){okk=true;break;}hi*=2;}
 if(!okk){g.P0=sv;return Infinity;}
 for(var j=0;j<70;j++){var m=(lo+hi)/2;g.P0=m;if(fvG(g,N)>=C)hi=m;else lo=m;}
 g.P0=sv;return hi;}
function gYears(g){var t=m2g(g,gTarget(g));return g.solveY||(isFinite(t)&&t>0?Math.max(1,Math.ceil(t/12)):3);}
function calcProfile(){if(!ok())return;var cap=CAPM[st.sh][st.inc],eP=Math.max(st.p,st.h),sc=st.a+eP+cap,base=(sc<=1)?0:((sc<=3)?1:2);
 st.proposed=Math.min(base,(cap===0)?1:2,(st.a===0)?1:2);}
function applyProfile(){st.goals.forEach(function(g){if(g.profile!==st.proposed){g.profile=st.proposed;var m=mkPort(g.cur,g.profile);g.weights=m.w;g.order=m.o;}});}

/* приток средств по годам (все цели) */
function inflowSection(){
 if(!st.goals.some(function(g){return g.P0>0;}))return '';
 var curs={};st.goals.forEach(function(g){if(g.P0>0)curs[g.cur]=1;});
 var html='';
 Object.keys(curs).forEach(function(cur){
  var yrs=5,rows=[],maxv=0;
  for(var k=1;k<=yrs;k++){
   var coup=0,contr=0;
   st.goals.forEach(function(g){
    if(g.cur!==cur||!(g.P0>0))return;
    var S=initS(g);
    for(var m=1;m<=k*12;m++){
     var pre={};Object.keys(S.b).forEach(function(p){pre[p]=S.b[p];});
     step(g,S,m);
     if(m>(k-1)*12){
      if(m%6===0)Object.keys(pre).forEach(function(p){if(CF[p]>0&&TERM[p]!==0)coup+=pre[p]*(CF[p]/100)/2;});
      if(g.freq==='год'){if(m>12&&m%12===1)contr+=g.PMT;}else contr+=g.PMT;}}});
   rows.push({y:k,coup:coup,contr:contr,t:coup+contr});
   if(coup+contr>maxv)maxv=coup+contr;}
  if(maxv<=0)return;
  var sm=(cur==='Тенге')?'₸':'$';
  var Wd=560,H=150,pad=26,bw=62,gap=(Wd-pad*2-bw*yrs)/(yrs-1);
  var svg='<svg viewBox="0 0 '+Wd+' '+(H+44)+'" width="100%">';
  rows.forEach(function(d,i){
   var x=pad+i*(bw+gap),hh=(d.t/maxv)*H,yy=H-hh+18;
   var hc=(d.t>0)?(d.coup/d.t)*hh:0, hp=hh-hc;
   svg+='<rect x="'+x.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw+'" height="'+hp.toFixed(1)+'" rx="3" fill="#A6D34A"/>';

/* купонные выплаты по датам (стек по продуктам) */
function couponChart(g,now,light){
 var S=initS(g),bars=[],maxv=0,prods={};
 for(var m=1;m<=60;m++){
  var pre={};Object.keys(S.b).forEach(function(p){pre[p]=S.b[p];});
  step(g,S,m);
  if(m%6!==0)continue;
  var byP={},tt=0,rl=[];
  Object.keys(pre).forEach(function(p){
   if(CF[p]>0&&TERM[p]!==0){var c=pre[p]*(CF[p]/100)/2;if(c>0){byP[p]=c;tt+=c;prods[p]=1;}}
   if(TERM[p]>0&&m%TERM[p]===0)rl.push(p);});
  if(tt<=0)continue;
  bars.push({m:m,d:addM(now,m),t:tt,byP:byP,rl:rl});
  if(tt>maxv)maxv=tt;}
 if(!bars.length)return '';
 var lab=light?'#6b7a70':'#9BA19C',tot0=light?'#007A3D':'#32D74B';
 var n=bars.length,Wd=560,H=140,padL=8,padB=42,bw=Math.min(46,(Wd-padL*2)/n-8),gap=((Wd-padL*2)-bw*n)/(n-1||1);
 var svg='<svg viewBox="0 0 '+Wd+' '+(H+padB)+'" width="100%">';
 bars.forEach(function(b,i){
  var x=padL+i*(bw+gap),hh=(b.t/maxv)*H,y0=H-hh+16,acc=0;
  Object.keys(b.byP).forEach(function(p){var sh2=(b.byP[p]/b.t)*hh;
   svg+='<rect x="'+x.toFixed(1)+'" y="'+(y0+acc).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+sh2.toFixed(1)+'" fill="'+COL[p]+'"/>';
   if(sh2>=10)svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y0+acc+sh2/2+2.6).toFixed(1)+'" font-size="6.5" font-weight="700" fill="#132015" text-anchor="middle">'+fmtNum(b.byP[p])+'</text>';
   acc+=sh2;});
  svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y0-5).toFixed(1)+'" font-size="8.5" font-weight="700" fill="'+tot0+'" text-anchor="middle">'+fmtNum(b.t)+'</text>';
  svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H+28)+'" font-size="8.5" fill="'+lab+'" text-anchor="middle">'+mLabel(b.d)+'</text>';
  if(b.rl.length)svg+='<circle cx="'+(x+bw/2).toFixed(1)+'" cy="'+(H+36)+'" r="2.6" fill="#F5C043"/>';});
 svg+='</svg>';
 var lg='<div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:'+lab+';margin-top:6px">';
 Object.keys(prods).forEach(function(p){lg+='<span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+COL[p]+';margin-right:4px"></i>'+dispName(p)+'</span>';});
 lg+='<span><i style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#F5C043;margin-right:4px"></i>погашение и переоформление ноты</span></div>';
 return svg+lg;}

/* ================== ЭКРАН: НАСТРОЙКА ПОРТФЕЛЯ ================== */
function renderPset(){
 var g=W();if(!g){goHome();return;}
 var s2=gSum(g),pr=gRisk(g);
 var h=topBlock('Настройка портфеля','','back()',0);
 h+='<div class="cnt">';
 h+='<div style="font-size:14px;color:var(--mut);margin:2px 0 8px">Купоны по нотам</div>'
  +'<div class="chips" style="margin-bottom:16px">'
  +[['out','Выводить'],['reinv','Докупать продукт'],['dep','Копить на депозите']].map(function(c){
   return '<button class="chip'+(st.coupon===c[0]?' on':'')+'" onclick="setCoupon(\''+c[0]+'\')">'+c[1]+'</button>';}).join('')+'</div>';
 g.order.forEach(function(p,i){
  var e=eff(g,p),w=g.weights[p];
  h+='<div class="pcard"><div class="pc-h"><span class="pic" style="background:'+hexA(COL[e],'33')+'">'+EMO[e]+'</span>'
   +'<div style="flex:1;min-width:0"><div class="pc-n">'+dispName(e)+'</div><div class="pc-w" id="pw_'+i+'">'+w+'% портфеля</div></div>'
   +'<div style="text-align:right"><div class="pc-y">'+String(Y[e]).replace('.',',')+'% годовых</div><div class="pc-a" id="pa_'+i+'">'+fmtG(g.P0*w/100,g)+'</div></div>'
   +'<button class="px" onclick="delProd('+i+')">✕</button></div>'
   +'<input type="range" min="0" max="100" step="5" value="'+w+'" style="--f:'+w+'%" id="sl_'+i+'" oninput="setWeight('+i+',this)">'
   +'<div class="pc-mm"><span>0%</span><span>100%</span></div></div>';});
 h+='<div class="sumlbl" id="sumlbl">Сумма долей: <b'+(s2===100?'':' class="warn"')+'>'+s2+'%</b>'+(s2!==100?' — нужно 100%':'')+' · профиль портфеля: <b>'+names[pr]+'</b></div>';
 if(pr>g.profile)h+='<div class="banner red" id="riskbn">⚠ Портфель рискованнее профиля («'+names[g.profile]+'» → «'+names[pr]+'»). Требует явного согласия клиента.</div>';
 h+='<button class="cta white" onclick="addSheet()">Добавить продукт&nbsp;&nbsp;+</button>';
 h+='</div><div class="ctaw"><button class="cta" id="psave" onclick="back()"'+(s2===100?'':' disabled')+'>Сохранить портфель</button><div class="homebar"></div></div>';
 el('scr-pset').innerHTML=h;}
function setCoupon(c){st.coupon=c;renderPset();save();}
function setWeight(i,inp){var g=W(),p=g.order[i],o=0;
 g.order.forEach(function(q){if(q!==p)o+=g.weights[q];});
 var v=parseInt(inp.value);if(o+v>100){v=100-o;inp.value=v;}
 g.weights[p]=v;inp.style.setProperty('--f',v+'%');
 el('pw_'+i).textContent=v+'% портфеля';
 el('pa_'+i).textContent=fmtG(g.P0*v/100,g);
 var s2=gSum(g),pr=gRisk(g);
 el('sumlbl').innerHTML='Сумма долей: <b'+(s2===100?'':' class="warn"')+'>'+s2+'%</b>'+(s2!==100?' — нужно 100%':'')+' · профиль портфеля: <b>'+names[pr]+'</b>';
 el('psave').disabled=(s2!==100);save();}
function delProd(i){var g=W(),p=g.order[i];delete g.weights[p];g.order.splice(i,1);renderPset();save();}
function addSheet(){
 var g=W(),av=CURSET[g.cur].filter(function(p){return g.order.indexOf(p)<0;});
 var rows=av.length?av.map(function(p){
  return '<div class="shrow" onclick="addProd(\''+p+'\')"><span class="pic" style="background:'+hexA(COL[p],'33')+'">'+EMO[p]+'</span><div class="bd"><div class="n">'+dispName(p)+'</div><div class="s">'+(TERM[p]===0?'бессрочно':('нота · '+TERM[p]+' мес'))+(CF[p]===0?' · без купона':'')+'</div></div><span class="y">'+String(Y[p]).replace('.',',')+'%</span></div>';}).join('')
  :'<div style="color:var(--mut);font-size:14px;padding:8px 0 14px">Все доступные продукты уже в портфеле.</div>';
 el('sheetWrap').innerHTML='<div class="ovl" onclick="closeSheet()"><div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div><div class="sh-t">Добавить продукт</div>'+rows+'</div></div>';}
function addProd(p){var g=W(),s2=gSum(g),w=10;if(s2+w>100)w=Math.max(0,100-s2);
 g.weights[p]=w;g.order.push(p);closeSheet();renderPset();save();}
function infoSheet(p){
 var rk=RISK[p]<0.6?'Низкий':(RISK[p]<=1.3?'Средний':'Высокий');
 el('sheetWrap').innerHTML='<div class="ovl" onclick="closeSheet()"><div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div>'
  +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><span class="pic" style="background:'+hexA(COL[p],'33')+';width:48px;height:48px;font-size:24px">'+EMO[p]+'</span><div class="sh-t" style="margin:0">'+dispName(p)+'</div></div>'
  +'<div class="irow"><span class="k">Ожидаемая доходность</span><span class="v" style="color:var(--greenbr)">'+String(Y[p]).replace('.',',')+'% годовых</span></div>'
  +'<div class="irow"><span class="k">Купон</span><span class="v">'+(CF[p]===0?('нет · простой % — '+(Y[p]*3)+'% за 3 года'):(String(CF[p]).replace('.',',')+'% · раз в 6 мес'))+'</span></div>'
  +'<div class="irow"><span class="k">Срок</span><span class="v">'+(TERM[p]===0?'бессрочно':(TERM[p]+' мес'))+'</span></div>'
  +'<div class="irow"><span class="k">Риск</span><span class="v">'+rk+'</span></div>'
  +'</div></div>';}

/* ================== PDF (печатная версия из исходника) ================== */
function pdfCheck(){
 if(!ok())return 'Пройдите анкету — ответьте на все 5 вопросов.';
 var g=W();
 if(!g)return 'Добавьте цель.';
 if(!(g.P0>0&&g.sum>0))return 'Укажите сумму цели и стартовый капитал.';
 if(gSum(g)!==100)return 'Доли портфеля должны давать 100%.';
 return '';}
function buildPV(){
 var now=new Date(),d=now.toLocaleDateString('ru-RU');
 var list=st.goals.filter(function(g){return g.P0>0&&g.sum>0&&gSum(g)===100;});
 var titles=list.map(function(g,i){return g.name||('Цель '+(i+1));});
 var h='<div class="pv-head"><div class="pv-brand">N1 <span>× Bereke Bank</span></div><div class="pv-sub">Инвестиционный план · '+d+'<br>конфиденциально</div></div>'
  +'<div class="pv-h1">Инвестиционный план</div>'
  +'<div class="pv-kpi"><div class="pv-k"><div class="l">Цель</div><div class="v" style="font-size:10pt">'+(titles.join(' · ')||'—')+'</div></div>'
  +'<div class="pv-k"><div class="l">Валюта</div><div class="v">'+(list.map(function(g){return g.cur;}).filter(function(v,k,ar){return ar.indexOf(v)===k;}).join(' / ')||'—')+'</div></div>'
  +'<div class="pv-k"><div class="l">Риск-профиль</div><div class="v">'+names[st.proposed]+'</div></div></div>';
 list.forEach(function(g,i){
  var C=gTarget(g),t=m2g(g,C),cfs=cfList(g),cft=cfs.reduce(function(a2,x){return a2+x.money;},0);
  var incY=fvG(g,12)-g.P0-((g.freq==='год')?0:g.PMT*12);
  h+='<div class="pv-card">'
   +'<div class="pv-goalhead"><div class="pv-goalname">'+(i+1)+'. '+(g.name||'Цель '+(i+1))+'</div>'
   +'<div class="pv-goalsum">'+fmtG(C,g)+'</div>'
   +((g.type==='income')?('<div class="pv-goalmeta">капитал для дохода '+fmtG(g.sum,g)+'/мес</div>'):'')+'</div>'
   +'<div class="pv-hero">'
   +'<div class="pv-hbox term2"><div class="l">Срок достижения</div><div class="v">'+ftime(t)+'</div></div>'
   +'<div class="pv-hbox money"><div class="l">Вносится сейчас</div><div class="v">'+fmtG(g.P0,g)+'</div></div>'
   +'<div class="pv-hbox money"><div class="l">Пополнение</div><div class="v">'+(g.PMT>0?(fmtG(g.PMT,g)+'<span style="font-size:9px;font-weight:600;color:#6b7a70"> / '+(g.freq==='год'?'год':'мес')+'</span>'):'—')+'</div></div>'
   +'</div><div class="pv-hero">'
   +'<div class="pv-hbox coup"><div class="l">Купоны в год</div><div class="v">'+fmtG(cft,g)+'</div></div>'
   +'<div class="pv-hbox coup"><div class="l">Купоны в месяц</div><div class="v">'+fmtG(cft/12,g)+'</div></div>'
   +'<div class="pv-hbox"><div class="l">Доход за 1-й год</div><div class="v">'+fmtG(incY,g)+'</div></div>'
   +'</div>'
   +'<div class="pv-sect">Состав портфеля</div>';
  cfs.forEach(function(x){
   h+='<div class="pv-prod"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+COL[x.p]+'"></i>'
    +'<span class="nm">'+dispName(x.p)+'</span><span class="w">'+x.w+'% · купон '+String(x.cf).replace('.',',')+'%</span>'
    +'<span class="amt">'+fmtG(x.money,g)+'/год</span></div>';});
  if(isFinite(t)&&t>0){var yrs=Math.min(8,Math.ceil(t/12)),prev=g.P0;
   h+='<div class="pv-yr"><div class="pv-sect">Путь к цели по годам</div>'
    +'<div class="pv-yrh"><span class="pv-yc1">Год</span><span class="pv-yc">Пополнено</span><span class="pv-yc">Доход</span><span class="pv-yc">Капитал</span></div>';
   for(var k=1;k<=yrs;k++){var fv=fvG(g,k*12),cc=(g.freq==='год')?((k===1)?0:g.PMT):g.PMT*12,inc=fv-prev-cc,hit=(t>(k-1)*12&&t<=k*12);
    h+='<div class="pv-yrr'+(hit?' hit':'')+'"><span class="pv-yc1">'+k+(hit?' ✓':'')+'</span><span class="pv-yc">'+fmtNum(cc)+'</span><span class="pv-yc">'+fmtNum(inc)+'</span><span class="pv-yc">'+fmtNum(fv)+'</span></div>';
    prev=fv;}
   h+='</div>';}
  var cch=couponChart(g,now,true);
  if(cch)h+='<div class="pv-sect" style="margin-top:9px">Купонные выплаты по датам</div>'+cch;
  h+='</div>';});
 h+='<div class="pv-foot"><b>Оговорки.</b> Доходность индикативная, не гарантия. Тело ноты не растёт — купон начисляется на первоначальный номинал. Дракон купона не платит: доход — простой процент (60% за 3 года в тенге, 30% в долларах). Условные купоны (Барыс, Арыстан) выплачиваются только при выполнении барьера. Ноты живут 1–3 года; расчёт далее предполагает переоформление на тех же условиях — допущение, а не прогноз. Самрук: «100% защита» кредитно-привязана к 6 эмитентам. Тенговые и долларовые доходности не сравниваются напрямую. Документ не является инвестиционной рекомендацией.</div>';
 el('printView').innerHTML=h;}
function uiPDF(){
 var err=pdfCheck();
 if(err){toast(err);return;}
 buildPV();
 window.print();}

/* ================== ХРАНЕНИЕ ================== */
function save(){try{localStorage.setItem('berekeGoalsProto',JSON.stringify({st:st,gid:gid}));}catch(e){}}
function load(){try{
 var d=JSON.parse(localStorage.getItem('berekeGoalsProto'));
 if(d&&d.st){st=d.st;gid=d.gid||1;
  ['a','inc','p','sh','h'].forEach(function(k){if(!(k in st))st[k]=undefined;});
  if(!st.goals)st.goals=[];
  st.goals=st.goals.filter(function(g){return g.saved;});}
}catch(e){}}
load();
show('home');
